# The Next app lives in web/, so Netlify builds from there.
# publish is relative to base. The Next runtime is declared explicitly rather
# than relying on auto-detection, which does not always fire when the app is
# in a subdirectory.
[build]
  base    = "web"
  command = "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # Netlify's secret scanner fails the build when a variable marked "Contains
  # secret values" appears in deploy artifacts. Next.js bakes env vars into the
  # SERVER function bundle, which is not web-accessible, so this is a false
  # positive for every one of these — they are read only in server code.
  #
  # Every key is listed, not just the sensitive ones: the scanner checks EVERY
  # env var's value against build output, so TURSO_DATABASE_URL and LOCAL_TZ
  # fail the build just as readily once they exist.
  #
  # What actually protects these is verified separately and still holds:
  #   - .env is gitignored; no value appears in the repo or its history
  #   - nothing uses a NEXT_PUBLIC_ prefix, so nothing is inlined for browsers
  #   - lib/client.ts, lib/db.ts and lib/tmdbApi.ts import "server-only", which
  #     fails the build if a client component ever pulls them in
  SECRETS_SCAN_OMIT_KEYS = "APP_PASSWORD,AUTH_SECRET,TURSO_AUTH_TOKEN,TMDB_API_KEY,TURSO_DATABASE_URL,LOCAL_TZ"

[[plugins]]
  package = "@netlify/plugin-nextjs"
